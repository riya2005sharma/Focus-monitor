<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Focus Monitor</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-logo">🎯</div>
        <h1 class="auth-title">Focus Monitor</h1>
        <p class="auth-subtitle">AI-powered study session tracker</p>

        <div class="auth-card">
            <h2>Welcome back</h2>
            <div id="error-msg" class="error-box" style="display:none;"></div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') login()" />
            </div>
            <button onclick="login()" class="btn-primary">Login →</button>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>

    <script>
        var API = "http://localhost:8000";

        // Already logged in — go to dashboard
        if (localStorage.getItem("token")) window.location.href = "dashboard.html";

        async function login() {
            var email = document.getElementById("email").value.trim();
            var password = document.getElementById("password").value.trim();
            var errEl = document.getElementById("error-msg");
            errEl.style.display = "none";

            if (!email || !password) {
                errEl.textContent = "Please fill in all fields.";
                errEl.style.display = "block";
                return;
            }

            try {
                var res = await fetch(API + "/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                var data = await res.json();
                if (res.ok) {
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("username", data.username);
                    window.location.href = "dashboard.html";
                } else {
                    errEl.textContent = data.detail || "Login failed.";
                    errEl.style.display = "block";
                }
            } catch (e) {
                errEl.textContent = "Cannot connect to server. Is the backend running?";
                errEl.style.display = "block";
            }
        }
    </script>
</body>

</html>
