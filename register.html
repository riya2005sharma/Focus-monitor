<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — Focus Monitor</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-logo">🎯</div>
        <h1 class="auth-title">Focus Monitor</h1>
        <p class="auth-subtitle">Create your account to get started</p>

        <div class="auth-card">
            <h2>Create Account</h2>
            <div id="error-msg" class="error-box" style="display:none;"></div>
            <div id="success-msg" class="success-box" style="display:none;"></div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="yourname" />
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" />
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') register()" />
            </div>
            <button onclick="register()" class="btn-primary">Create Account →</button>
            <p class="auth-switch">Already have an account? <a href="index.html">Login</a></p>
        </div>
    </div>

    <script>
        var API = "http://localhost:8000";

        async function register() {
            var username = document.getElementById("username").value.trim();
            var email = document.getElementById("email").value.trim();
            var password = document.getElementById("password").value.trim();
            var errEl = document.getElementById("error-msg");
            var sucEl = document.getElementById("success-msg");
            errEl.style.display = "none";
            sucEl.style.display = "none";

            if (!username || !email || !password) {
                errEl.textContent = "Please fill in all fields.";
                errEl.style.display = "block";
                return;
            }

            try {
                var res = await fetch(API + "/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password
                    })
                });
                var data = await res.json();
                if (res.ok) {
                    sucEl.textContent = "Account created! Redirecting to login...";
                    sucEl.style.display = "block";
                    setTimeout(function() {
                        window.location.href = "index.html";
                    }, 1500);
                } else {
                    errEl.textContent = data.detail || "Registration failed.";
                    errEl.style.display = "block";
                }
            } catch (e) {
                errEl.textContent = "Cannot connect to server.";
                errEl.style.display = "block";
            }
        }
    </script>
</body>

</html>
